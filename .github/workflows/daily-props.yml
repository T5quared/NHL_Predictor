name: Daily props (NHL + NFL)

on:
  schedule:
    # GitHub runs scheduled jobs late (3-6 hours here so far), so there are several attempts a day.
    # The first run that gets real odds does the work for that sport; later attempts exit in seconds.
    # Times are UTC: 15:23 = 10:23 AM, 17:11 = 12:11 PM, 18:41 = 1:41 PM, 20:53 = 3:53 PM Eastern (winter).
    - cron: '23 15 * * *'
    - cron: '11 17 * * *'
    - cron: '41 18 * * *'
    - cron: '53 20 * * *'
    # Sundays, NFL only, well before the 1 PM kickoffs: 7:07 AM and 8:37 AM Eastern (winter)
    - cron: '7 12 * * 0'
    - cron: '37 13 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build the dashboard but do not post to Discord or log picks)'
        type: boolean
        default: false
      sports:
        description: 'Sports to run'
        type: choice
        options: ['NHL,NFL', 'NHL', 'NFL']
        default: 'NHL,NFL'

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node --test
      - name: Run props scan
        env:
          SPORTSGAMEODDS_API_KEY: ${{ secrets.SPORTSGAMEODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SPORTS: ${{ (github.event.schedule == '7 12 * * 0' || github.event.schedule == '37 13 * * 0') && 'NFL' || inputs.sports || 'NHL,NFL' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node src/props/run-props.js
      - name: Save props and dashboard to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboard/props.html
          git diff --cached --quiet || git commit -m "Props $(TZ=America/New_York date +%F)"
          git pull --rebase --quiet
          git push
