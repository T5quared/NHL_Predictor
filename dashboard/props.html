<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prop Hit Rates</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0b; --card: #141416; --card2: #1b1b1e; --line: #2a2a2f; --ink: #f5f5f5; --muted: #9a9aa3; --head: #b5b5bd;
    --red: #e11d2e; --red-dim: #3a0d12;
    /* hit-rate tiers: green = beats the price by 5+ pts, yellow = within 5, red = 5+ below */
    --g-bg: rgba(34,197,94,.13); --g-ink: #6ee79a; --g-pill: #16a34a;
    --y-bg: rgba(234,179,8,.13);  --y-ink: #fcd34d; --y-pill: #ca8a04;
    --r-bg: rgba(239,68,68,.13);  --r-ink: #fca5a5; --r-pill: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 18px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--red); }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; } h1::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--red); border-radius: 2px; margin-right: 8px; vertical-align: 2px; }
  .meta { color: var(--muted); font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tab { border: 1px solid var(--line); background: var(--card); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
  .tab.on { background: var(--red); color: #fff; border-color: var(--red); }
  .warn { background: var(--red-dim); color: #fff; border: 1px solid var(--red); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }

  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; margin-bottom: 14px; }
  .f label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--head); text-transform: uppercase; margin-bottom: 5px; }
  .f select, .f input, .ms > button { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 0 10px; font: inherit; color: var(--ink); }
  .f select:focus, .f input:focus, .ms > button:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 2px var(--red-dim); }
  .odds-range { display: flex; gap: 6px; } .odds-range input { min-width: 0; }
  .ms { position: relative; } .ms > button { text-align: left; cursor: pointer; }
  .ms .menu { display: none; position: absolute; z-index: 5; top: 42px; left: 0; right: 0; background: var(--card2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .ms.open .menu { display: block; } .ms .menu label { display: flex; gap: 8px; align-items: center; padding: 6px; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); font-weight: 500; margin: 0; }
  .ms .menu input { accent-color: var(--red); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  th { background: #000; text-align: left; font-size: 11px; letter-spacing: .06em; color: var(--head); font-weight: 700; padding: 12px; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 2px solid var(--red); }
  th.on { color: #fff; } th.on .arr { color: var(--red); opacity: 1; } th .arr { opacity: .5; margin-left: 3px; }
  td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  tbody tr:hover td { background-color: var(--card2); }
  th:first-child, td:first-child { position: sticky; left: 0; z-index: 1; background: var(--card); box-shadow: 1px 0 0 var(--line); }
  th:first-child { background: #000; }
  .player { display: flex; align-items: center; gap: 10px; }
  .player img { width: 26px; height: 26px; }
  .pname { font-weight: 650; font-size: 15px; }
  .match { color: var(--muted); font-size: 12px; }
  .prop { font-weight: 500; } .up { color: #fff; font-weight: 800; } .down { color: var(--red); font-weight: 800; }
  td.hit { padding: 0; } .hitcell { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; height: 100%; min-height: 52px; font-size: 13px; }
  .hitcell.g { background: var(--g-bg); color: var(--g-ink); } .hitcell.y { background: var(--y-bg); color: var(--y-ink); } .hitcell.r { background: var(--r-bg); color: var(--r-ink); } .hitcell.n { color: var(--muted); }
  .pill { color: #fff; font-weight: 700; font-size: 12px; padding: 3px 7px; border-radius: 6px; min-width: 44px; text-align: center; }
  .g .pill { background: var(--g-pill); } .y .pill { background: var(--y-pill); } .r .pill { background: var(--r-pill); } .n .pill { background: #3a3a40; }
  .num { font-weight: 700; font-variant-numeric: tabular-nums; }
  .edge-pos { color: #fff; } .edge-neg { color: var(--red); }
  .odds { font-weight: 700; } .books { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid #fff; color: #fff; margin-left: 6px; vertical-align: 2px; }
  .top { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 5px; background: var(--red); color: #fff; margin-right: 6px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 18px; }
  .panel { padding: 14px 16px; border-top: 3px solid var(--red); } .panel h2 { font-size: 14px; margin: 0 0 10px; }
  .kv { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; } .kv:first-of-type { border-top: 0; }
  .small { font-size: 12px; color: var(--muted); }
  .flag { color: var(--red); font-size: 11px; font-weight: 700; margin-top: 2px; }
  .when { color: var(--muted); font-size: 12px; } .proj { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .res-hit { color: var(--g-ink); font-weight: 700; } .res-miss { color: var(--r-ink); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prop Hit Rates</h1>
    <span class="meta" id="meta"></span>
    <div class="tabs"><button class="tab on" data-sport="NHL">NHL</button><button class="tab" data-sport="NFL">NFL</button></div>
  </header>
  <div id="warn"></div>

  <section id="main">
    <div class="filters">
      <div class="f"><label>Player</label><input id="q" placeholder="Search player..."></div>
      <div class="f"><label>Sort by</label><select id="sortBy"></select></div>
      <div class="f ms" id="mkts"><label>Prop markets</label><button type="button" id="mktBtn">All</button><div class="menu" id="mktMenu"></div></div>
      <div class="f"><label>Teams / games</label><select id="team"></select></div>
      <div class="f"><label>Side</label><select id="side"><option value="">All Sides</option><option value="over">Over / Yes</option><option value="under">Under / No</option></select></div>
      <div class="f"><label>Odds</label><div class="odds-range"><input id="omin" type="number" value="-250" step="5"><input id="omax" type="number" value="150" step="5"></div></div>
      <div class="f"><label>Show</label><select id="view"><option value="top">Top picks</option><option value="all">All props</option></select></div>
    </div>

    <div class="card"><div class="scroll"><table>
      <thead><tr id="headRow"></tr></thead>
      <tbody id="rows"></tbody>
    </table></div></div>
    <p class="small" id="explain"></p>

    <div class="grid2">
      <div class="card panel"><h2 id="recTitle">Prop record</h2><div id="record"></div></div>
      <div class="card panel"><h2>Which half of the blend is predicting better?</h2><div id="brier"></div>
        <p class="small">Lower is better (Brier score). Shift the 60/40 blend toward whichever side wins once there are ~100 graded picks.</p></div>
      <div class="card panel"><h2>Recent results</h2><div id="recent"></div></div>
    </div>
  </section>
</div>

const $ = id => document.getElementById(id);
const pct = x => x == null ? '–' : Math.round(x * 100) + '%';
const fmtOdds = o => o == null ? '–' : (o > 0 ? '+' + o : '' + o);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const LABEL = { points: 'Points', assists: 'Assists', goals: 'Goals', shots: 'Shots on Goal',
  passing_yards: 'Passing Yards', rushing_yards: 'Rushing Yards', receiving_yards: 'Receiving Yards', receptions: 'Receptions', anytime_td: 'Anytime TD' };
const SHORT = { points: 'PTS', assists: 'AST', goals: 'G', shots: 'SOG', passing_yards: 'Pass Yds', rushing_yards: 'Rush Yds', receiving_yards: 'Rec Yds', receptions: 'Rec', anytime_td: 'ATD' };
let sport = 'NHL', S = null, sortKey = null;

const sections = (DATA && DATA.sports) || {};
if (!sections.NHL && sections.NFL) sport = 'NFL';
document.querySelectorAll('.tab').forEach(t => {
  t.classList.toggle('on', t.dataset.sport === sport);
  t.onclick = () => { sport = t.dataset.sport; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); load(); };
});
for (const id of ['q', 'sortBy', 'team', 'side', 'omin', 'omax', 'view']) $(id).addEventListener('input', render);
$('mktMenu').addEventListener('change', render);
$('mktBtn').onclick = () => $('mkts').classList.toggle('open');
document.addEventListener('click', e => { if (!$('mkts').contains(e.target)) $('mkts').classList.remove('open'); });

const wins = () => [...S.windows.map(n => 'l' + n), 'season'];
const winLabel = k => k === 'season' ? 'THIS SEASON' : `LAST ${k.slice(1)} GAMES`;
const gameKey = p => p.home ? `${p.opp} @ ${p.team}` : `${p.team} @ ${p.opp}`;
const whenOf = p => p.startsAt ? new Date(p.startsAt).toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' }) : '';

function load() {
  S = sections[sport];
  if (!S || !S.props) {
    $('meta').textContent = ''; $('warn').innerHTML = '';
    $('headRow').innerHTML = ''; $('rows').innerHTML = `<tr><td class="empty">No ${sport} data yet — this fills in after the daily props run.</td></tr>`;
    ['record', 'brier', 'recent', 'explain'].forEach(id => $(id).innerHTML = ''); return;
  }
  const when = new Date(S.generatedAt || DATA.generatedAt);
  $('meta').textContent = `${S.counts.games} games · ${S.counts.scanned} props scanned · ${S.counts.topPicks} top picks · updated ${when.toLocaleString([], { weekday: 'short', hour: 'numeric', minute: '2-digit' })}`;
  const warns = [];
  if (S.mode === 'standard-lines') warns.push('No odds feed today — standard lines only, so Edge and Odds are blank and picks are ranked by Final %.');
  if (S.warning) warns.push(esc(S.warning));
  $('warn').innerHTML = warns.map(w => `<div class="warn">⚠️ ${w}</div>`).join('');

  const W = wins();
  $('sortBy').innerHTML = [['edge', 'Edge'], ['finalProb', 'Final %'], ...W.map(k => [k, k === 'season' ? 'This Season' : `Last ${k.slice(1)} Games`])]
    .map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
  if (S.mode === 'standard-lines') $('sortBy').value = 'finalProb';
  $('headRow').innerHTML = `<th data-k="player">PLAYER</th><th data-k="prop">PROP</th>`
    + W.map(k => `<th data-k="${k}">${winLabel(k)}<span class="arr">⇅</span></th>`).join('')
    + ['modelProb:MODEL %', 'finalProb:FINAL %', 'edge:EDGE', 'odds:ODDS'].map(x => { const [k, l] = x.split(':'); return `<th data-k="${k}">${l}<span class="arr">⇅</span></th>`; }).join('');
  document.querySelectorAll('th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (['player', 'prop'].includes(k)) return;
    if ([...$('sortBy').options].some(o => o.value === k)) $('sortBy').value = k;
    sortKey = k; render();
  });
  const markets = [...new Set(S.props.map(p => p.market))];
  $('mktMenu').innerHTML = markets.map(m => `<label><input type="checkbox" value="${m}" checked> ${LABEL[m] || m}</label>`).join('');
  const games = [...new Set(S.props.map(gameKey))].sort();
  $('team').innerHTML = '<option value="">All Teams</option>' + games.map(g => `<option>${g}</option>`).join('');
  const w = S.windows, wt = DATA.settings.SPORTS[sport].weights, cons = DATA.settings.SPORTS[sport].consistent, F = DATA.settings.FILTERS;
  $('explain').innerHTML = (DATA.settings.SPORTS[sport].marketWeight ? `Final % = ${Math.round(DATA.settings.SPORTS[sport].marketWeight * 100)}% market price + ${100 - Math.round(DATA.settings.SPORTS[sport].marketWeight * 100)}% of (60% model + 40% hit rate) — anchored to the books until the model proves itself; ` : 'Final % = 60% model + 40% hit rate; ') + `hit rate windows weighted ${W.map(k => `${k === 'season' ? 'season' : 'L' + k.slice(1)} ${Math.round(wt[k] * 100)}%`).join(' · ')}, small samples pulled toward the market). `
    + (sport === 'NFL' ? 'Model: yardage uses the player\'s average and week-to-week spread; receptions and TDs use a count model; both adjusted for the opponent vs that position. ' : '')
    + `Edge = Final % minus the no-vig consensus price. Hit rates: green = 5+ points above the price, yellow = within 5, red = 5+ below. ✓ = ${cons.map(k => k === 'season' ? 'season' : 'L' + k.slice(1)).join(', ')} all beat the price. `
    + `Top picks (best ${DATA.settings.MAX_TOP_PICKS || 20}): ${DATA.settings.SPORTS[sport].minGames}+ games, Final ${Math.round(F.MIN_FINAL_PROB * 100)}%+, edge +${Math.round(F.MIN_EDGE * 100)}%+, odds ${F.MIN_ODDS} to +${F.MAX_ODDS}, ${F.MIN_BOOKS}+ books. Excluded (shown under All props with a ⚠): edges over ${Math.round(F.MAX_EDGE * 100)}%, and lines far from the player's history — the books usually know about an injury or role change the stats don't.`;
  $('recTitle').textContent = `${sport} prop record`;
  renderSide(); render();
}

function sortVal(p, k) {
  if (k === 'season' || /^l\d+$/.test(k)) return p.rates[k]?.pct ?? -1;
  if (k === 'odds') return p.bookOdds ?? -9999;
  if (k === 'edge') return p.edge ?? (p.finalProb - 0.5);
  return p[k] ?? -1;
}

function render() {
  if (!S || !S.props) return;
  const q = $('q').value.trim().toLowerCase();
  const mk = new Set([...$('mktMenu').querySelectorAll('input:checked')].map(i => i.value));
  $('mktBtn').textContent = mk.size === $('mktMenu').querySelectorAll('input').length ? 'All' : `${mk.size} selected`;
  const team = $('team').value, side = $('side').value, view = $('view').value;
  const omin = Number($('omin').value), omax = Number($('omax').value);
  const k = sortKey || $('sortBy').value; sortKey = null;
  const rows = S.props.filter(p =>
    (view === 'all' || p.topPick) && mk.has(p.market) && (!side || p.side === side)
    && (!q || p.playerName.toLowerCase().includes(q)) && (!team || team === gameKey(p))
    && (p.bookOdds == null || (p.bookOdds >= omin && p.bookOdds <= omax)));
  rows.sort((a, b) => sortVal(b, k) - sortVal(a, k));
  document.querySelectorAll('th[data-k]').forEach(th => th.classList.toggle('on', th.dataset.k === k));
  const cols = wins().length + 6;
  if (!rows.length) { $('rows').innerHTML = `<tr><td colspan="${cols}" class="empty">No props match these filters. Try “All props”.</td></tr>`; return; }
  $('rows').innerHTML = rows.slice(0, 400).map(row).join('');
}

function hitCell(r, ref) {
  if (!r || !r.n) return '<td class="hit"><div class="hitcell n">No games</div></td>';
  const d = r.pct - ref, cls = d >= 0.05 ? 'g' : d > -0.05 ? 'y' : 'r';
  return `<td class="hit"><div class="hitcell ${cls}"><span>Has hit ${r.hits}/${r.n} for</span><span class="pill">${pct(r.pct)}</span></div></td>`;
}

function flag(p) {
  const f = p.failed || [];
  if (f.includes('role')) return '<div class="flag">⚠ Line far from his history — likely role/injury change</div>';
  if (f.includes('too-good')) return '<div class="flag">⚠ Edge too big — books likely know something</div>';
  return '';
}

function propLabel(p) {
  if (p.market === 'anytime_td') return p.side === 'over' ? 'Anytime TD — Yes' : 'Anytime TD — No';
  return `${p.side === 'over' ? 'Over' : 'Under'} ${p.line} ${LABEL[p.market] || p.market}`;
}

function row(p) {
  const ref = p.implied ?? 0.5;
  const arrow = p.side === 'over' ? '<span class="up">↑</span>' : '<span class="down">↓</span>';
  const edge = p.edge == null ? '–' : `<span class="${p.edge >= 0 ? 'edge-pos' : 'edge-neg'}">${p.edge >= 0 ? '+' : ''}${(p.edge * 100).toFixed(1)}%</span>`;
  const sub = sport === 'NFL' ? `${esc(gameKey(p))} · ${esc(whenOf(p))} · ${esc(p.pos || '')} · ${p.gp} GP` : `${esc(gameKey(p))} · ${p.gp} GP`;
  const proj = p.projection != null && p.market !== 'anytime_td' && sport === 'NFL' ? `<div class="proj">Projection ${p.projection}</div>` : '';
  return `<tr>
    <td><div class="player">${p.logo ? `<img src="${esc(p.logo)}" alt="" onerror="this.style.visibility='hidden'">` : '<span style="width:26px"></span>'}
      <div><div class="pname">${p.topPick ? '<span class="top">TOP</span>' : ''}${esc(p.playerName)}${p.consistent ? '<span class="badge">✓ consistent</span>' : ''}</div>
      <div class="match">${sub}</div>${flag(p)}</div></div></td>
    <td class="prop">${arrow} ${propLabel(p)}${proj}</td>
    ${wins().map(k => hitCell(p.rates[k], ref)).join('')}
    <td class="num">${pct(p.modelProb)}</td><td class="num">${pct(p.finalProb)}</td><td class="num">${edge}</td>
    <td><div class="odds">${fmtOdds(p.bookOdds ?? null)}</div><div class="books">${p.bookOdds == null ? 'fair ' + fmtOdds(p.fairOdds) : 'consensus · ' + p.books + ' books'}</div></td>
  </tr>`;
}

function renderSide() {
  const r = S.record || { n: 0 };
  const lines = [`<div class="kv"><span>All graded picks</span><b>${r.n ? `${r.hits}/${r.n} (${pct(r.hits / r.n)})` : 'none yet'}</b></div>`];
  for (const [m, v] of Object.entries(r.byMarket || {})) lines.push(`<div class="kv"><span>${LABEL[m] || m}</span><span>${v.hits}/${v.n} (${pct(v.hits / v.n)})</span></div>`);
  $('record').innerHTML = lines.join('');
  const b = r.brier || {}, f = x => x == null ? '–' : x.toFixed(3);
  $('brier').innerHTML = r.n ? [['Model', b.model], ['Hit rate', b.hitRate], ['Final blend', b.final], ['Market price', b.market]]
    .map(([k, v]) => `<div class="kv"><span>${k}</span><b>${f(v)}</b></div>`).join('') : '<div class="small">Fills in after the first picks are graded.</div>';
  $('recent').innerHTML = (S.recentResults || []).slice(0, 15).map(p =>
    `<div class="kv"><span>${esc(String(p.date).slice(5))} ${esc(p.playerName)} ${p.market === 'anytime_td' ? 'ATD ' + (p.side === 'over' ? 'Yes' : 'No') : (p.side === 'over' ? 'O' : 'U') + ' ' + p.line + ' ' + (SHORT[p.market] || p.market)}</span>
     <span class="${p.result === 'hit' ? 'res-hit' : p.result === 'miss' ? 'res-miss' : 'small'}">${p.result}${p.actual != null ? ' (' + p.actual + ')' : ''}</span></div>`).join('')
    || '<div class="small">No graded picks yet.</div>';
}
load();
</script>
</body>
</html>
